<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar \u2014 Unify Hub</title>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<div class="app-shell" id="app-shell"></div>
<script src="/js/app.js"></script>
<script>
(async function () {
  const user = await requireAuth("/calendar.html");
  if (!user) return;
  const isAdmin = user.role === "admin";
  const main = document.getElementById("main-content");

  let dash;
  async function load() { dash = await apiFetch("/dashboard"); render(); }

  function rsvpBtns(e) {
    return `<div style="display:flex;gap:6px;">
      <button class="btn btn-sm ${e._mine === "going" ? "" : "btn-outline"}" data-rsvp="${e.id}" data-status="going">Going</button>
      <button class="btn btn-sm ${e._mine === "maybe" ? "" : "btn-outline"}" data-rsvp="${e.id}" data-status="maybe">Maybe</button>
      <button class="btn btn-sm ${e._mine === "declined" ? "" : "btn-outline"}" data-rsvp="${e.id}" data-status="declined">Can't go</button>
    </div>`;
  }

  function eventCard(e) {
    return `<div class="card" style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;">
        <div style="min-width:0;">
          <div style="font-weight:700;font-size:16px;">${escapeHtml(e.title)}</div>
          <div class="muted" style="font-size:13px;margin:4px 0 8px;">${fmtDateTime(e.starts_at)}${e.ends_at ? " \u2013 " + fmtDateTime(e.ends_at) : ""}${e.location ? " \u00b7 " + escapeHtml(e.location) : ""}</div>
          ${e.description ? `<div class="muted" style="font-size:13px;margin-bottom:8px;">${escapeHtml(e.description)}</div>` : ""}
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            ${rsvpBtns(e)}
            <button class="btn-outline btn btn-sm" data-view-rsvps="${e.id}">Who's attending</button>
          </div>
        </div>
        ${isAdmin ? `<button class="btn btn-outline btn-sm" data-delete-event="${e.id}">Delete</button>` : ""}
      </div>
      <div id="rsvp-list-${e.id}" style="display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;"></div>
    </div>`;
  }

  function render() {
    const events = [...dash.events].sort((a,b) => new Date(a.starts_at) - new Date(b.starts_at));
    main.innerHTML = `
      <div class="page-header">
        <h1>Calendar</h1>
        ${isAdmin ? `<button class="btn" id="new-event-btn">+ New event</button>` : ""}
      </div>
      <p class="muted" style="margin-top:-14px;">Tasks with due dates also show up on your <a href="/tasks.html">Tasks</a> page.</p>
      ${events.length ? events.map(eventCard).join("") : `<div class="empty-state">No events scheduled yet.</div>`}
    `;
    document.getElementById("new-event-btn")?.addEventListener("click", openCreateModal);
    main.querySelectorAll("[data-rsvp]").forEach(b => b.addEventListener("click", () => rsvp(b.dataset.rsvp, b.dataset.status)));
    main.querySelectorAll("[data-delete-event]").forEach(b => b.addEventListener("click", () => deleteEvent(b.dataset.deleteEvent)));
    main.querySelectorAll("[data-view-rsvps]").forEach(b => b.addEventListener("click", () => toggleRsvps(b.dataset.viewRsvps)));
  }

  async function toggleRsvps(id) {
    const el = document.getElementById(`rsvp-list-${id}`);
    if (el.style.display === "block") { el.style.display = "none"; return; }
    const { rsvps } = await apiFetch(`/events/rsvps?eventId=${id}`);
    el.innerHTML = rsvps.length ? rsvps.map(r => `<div style="font-size:13px;padding:3px 0;">${escapeHtml(r.name)} \u2014 <span class="muted">${r.status}</span></div>`).join("") : `<div class="muted" style="font-size:13px;">No RSVPs yet.</div>`;
    el.style.display = "block";
  }

  async function rsvp(eventId, status) {
    try { await apiFetch("/events/rsvp", { method: "POST", body: { eventId, status } }); toast("RSVP saved"); await load(); }
    catch (e) { toast(e.message, true); }
  }
  async function deleteEvent(id) {
    if (!confirm("Delete this event?")) return;
    try { await apiFetch("/events/remove", { method: "POST", body: { id } }); toast("Event deleted"); await load(); }
    catch (e) { toast(e.message, true); }
  }

  function openCreateModal() {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `<div class="modal">
      <h2>New event</h2>
      <form id="event-form">
        <div class="field"><label>Title</label><input class="input" name="title" required></div>
        <div class="field"><label>Description</label><textarea class="input" name="description" rows="3"></textarea></div>
        <div class="grid grid-2">
          <div class="field"><label>Starts</label><input class="input" type="datetime-local" name="startsAt" required></div>
          <div class="field"><label>Ends (optional)</label><input class="input" type="datetime-local" name="endsAt"></div>
        </div>
        <div class="field"><label>Location</label><input class="input" name="location"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
          <button type="button" class="btn btn-outline" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn">Create event</button>
        </div>
      </form>
    </div>`;
    document.body.appendChild(backdrop);
    backdrop.querySelector("#cancel-btn").addEventListener("click", () => backdrop.remove());
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) backdrop.remove(); });
    backdrop.querySelector("#event-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = {
        title: fd.get("title"), description: fd.get("description"),
        startsAt: new Date(fd.get("startsAt")).toISOString(),
        endsAt: fd.get("endsAt") ? new Date(fd.get("endsAt")).toISOString() : null,
        location: fd.get("location"),
      };
      try { await apiFetch("/events/create", { method: "POST", body }); toast("Event created"); backdrop.remove(); await load(); }
      catch (err) { toast(err.message, true); }
    });
  }

  await load();
})();
</script>
</body>
</html>
